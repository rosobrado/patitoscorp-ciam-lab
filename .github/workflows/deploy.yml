name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH:   'src/CiamLabApp.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC federation -> Azure
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore + Publish
        run: |
          dotnet restore "${{ env.PROJECT_PATH }}"
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release -o ./publish --no-restore

      - name: Login to Azure (OIDC)
        # Configure federated credentials on your service principal:
        # https://learn.microsoft.com/azure/developer/github/connect-from-azure
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Web App
        # https://github.com/Azure/webapps-deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package:  ./publish
